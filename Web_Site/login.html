<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seinen Vila Alpina | Página Inicial</title>
    <link rel="stylesheet" href="Style/style.css">
    <link rel="icon" href="assets/icon/logo_seinen.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Londrina+Shadow&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

</head>

<body>
    <div class="header" id="inicio">
        <div class="container">
            <img id="logo" src="assets/icon/logo_seinen.png">
            <ul class="navbar">
                <li>
                    <a class="btn-navbar" href="index.html">Home</a>
                </li>
                <li>
                    <a class="btn-navbar" href="index.html">Sobre nós</a>
                </li>
                <li>
                    <a class="btn-navbar" href="index.html">Eventos</a>
                </li>
                <li>
                    <a class="btn-navbar" href="index.html">Contato</a>
                </li>
                <li>
                    <button id="cadastro" onclick="cadastro()"><a href="cadastro.html">Cadastre-se</a></button>
                </li>
                <li class="agora">
                    <button id="login" onclick="login()"><a href="#login">Login</a></button>
                </li> 
            </ul>
        </div>
    </div>

    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-login">
                <h2>Olá de volta!</h2>
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="container">
            <h4>Eduarda Kaori Nakandakari &hearts; Seinen Vila Alpina &copy; 2025</h4>
            <span class="version">v1.0.0</span><br>
            <a href="https://www.instagram.com/seinen_vilaalpina?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="><img  src="assets/icon/icons8-instagram-100.png"></a>
        </div>
    </div>
</body>

</html>
